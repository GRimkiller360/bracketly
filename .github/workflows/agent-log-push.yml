name: Push agent activity to dashboard

on:
  push:
    branches: [main]
    paths:
      - 'status/agent-log.jsonl'

permissions:
  contents: read

jobs:
  push-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push payload
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          BRACKETLY_INGEST_SECRET: ${{ secrets.BRACKETLY_INGEST_SECRET }}
        run: |
          LAST_LINE=$(tail -1 status/agent-log.jsonl)

          # Dashboard gets a short, human-skimmable summary only — no raw
          # diffs or commit-message dumps. The full detailed entry always
          # stays in status/agent-log.jsonl in the repo for anyone who wants
          # to dig deeper; this is just what gets pushed to the dashboard.
          #
          # The routine itself now writes a plain-language short_summary
          # field (what changed and why, no housekeeping narration) — use
          # that directly. Fall back to a truncated first-sentence extract
          # from the full summary only for older entries written before
          # short_summary existed.
          node -e "
            const fs = require('fs');
            const entry = JSON.parse(process.argv[1]);
            let summary = entry.short_summary;
            if (!summary) {
              const raw = entry.summary || '';
              summary = (raw.match(/^.*?[.!?](?:\s|$)/) || [raw])[0].trim();
            }
            const CAP = 500;
            if (summary.length > CAP) summary = summary.slice(0, CAP).trim() + '…';
            const payload = {
              date: entry.date,
              action_taken: entry.action_taken,
              files_changed: entry.files_changed,
              summary,
            };
            fs.writeFileSync('agent_log_payload.json', JSON.stringify(payload));
          " "$LAST_LINE"

          curl -s -X POST "$DASHBOARD_URL/api/bracketly-status/agent-log-ingest" \
            -H "X-Ingest-Secret: $BRACKETLY_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @agent_log_payload.json \
            -w "\nHTTP_STATUS:%{http_code}\n"
